    <stop offset="96%" stop-color="#22B8E0" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#22B8E0" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="chromeRing" x1="0%" y1="0%" x2="0%" y2="100%">
