<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="1360" height="920" role="img">
<title>Rasoi Care logo in chrome and glass</title>
<desc>A polished chrome-and-glass presentation with rim lighting, mirrored reflections on the ring, and glass highlights on the shield and letters, over a deep midnight backdrop.</desc>

