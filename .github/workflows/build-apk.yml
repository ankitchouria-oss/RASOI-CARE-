name: Build APK

# Runs on every push, and can also be triggered manually from the Actions tab
# (Actions → Build APK → Run workflow) without needing a new commit.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      # Gradle reads android/local.properties (for the Flutter SDK path and
      # Android SDK path) the moment it's invoked — even just to generate the
      # wrapper jar below. Normally `flutter run`/`flutter build` writes this
      # file for you on a real machine; on a fresh CI checkout it doesn't
      # exist yet, so we write it ourselves before Gradle ever runs.
      - name: Write android/local.properties
        working-directory: android
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      # This repo's android/gradle/wrapper/gradle-wrapper.properties already
      # points at Gradle 8.9 — we just need the wrapper's jar, which is a
      # binary that can't be committed as plain text. We generate it in a
      # throwaway empty folder (not our project folder) so this bootstrap
      # Gradle never has to evaluate our build scripts — doing that with a
      # newer system Gradle trips a Groovy/Flutter-plugin incompatibility.
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Generate gradle-wrapper.jar in an isolated folder
        run: |
          mkdir -p /tmp/wrapper-bootstrap
          cd /tmp/wrapper-bootstrap
          gradle wrapper --gradle-version 8.9
          cp gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/android/gradle/wrapper/gradle-wrapper.jar"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking — surfaces issues without failing the build)
        run: flutter analyze || true

      # Debug APK: no signing config needed, installs directly on any device
      # with "unknown sources" allowed. This is the one most people want first.
      - name: Build debug APK
        run: flutter build apk --debug

      # Release APK: uses android/key.properties if you've added one (see the
      # main README §1b), otherwise falls back to the debug signing key so
      # this step never fails — just isn't Play-Store-ready until you sign it.
      - name: Build release APK
        run: flutter build apk --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: care-plus-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: care-plus-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
