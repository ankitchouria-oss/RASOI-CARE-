name: Build APK

# Runs on every push, and can also be triggered manually from the Actions tab
# (Actions → Build APK → Run workflow) without needing a new commit.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      # TEMPORARY, ONE-TIME FIX: the android/ folder in this repo was written
      # by hand (no Flutter toolchain was available at the time), and it has
      # drifted from what this Flutter version's Gradle plugin actually
      # expects. Rather than keep hand-patching individual files, we let the
      # real Flutter tooling regenerate android/ from scratch here — it only
      # touches the android/ folder, not lib/, assets/, or pubspec.yaml.
      #
      # Heads up: this wipes our custom AndroidManifest.xml permissions and
      # the custom launcher icon back to Flutter's defaults for this run.
      # Once we confirm the build actually succeeds, the next step is to
      # re-apply those on top of this now-correct structure and commit the
      # result — then this step gets removed so it's not doing this on every
      # single push.
      - name: Regenerate the android/ platform folder
        run: flutter create --platforms=android --org com.careplus .

      # firebase_auth requires minSdk 23; Flutter's freshly-generated default
      # is 21. Patching this reliably for both Kotlin DSL and Groovy templates.
      - name: Bump minSdk to 23 (required by firebase_auth)
        run: |
          set -euo pipefail
          echo "Patching android/app build files to set minSdk = 23"
          # Handle Kotlin DSL (build.gradle.kts) and Groovy (build.gradle) variants.
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              echo "Patching $f"
              # Replace common forms:
              #  - minSdkVersion 21
              #  - minSdk = flutter.minSdkVersion
              #  - minSdk = 21
              sed -i -E 's/minSdkVersion[[:space:]]+[0-9]+/minSdkVersion 23/g' "$f" || true
              sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*flutter\.[a-zA-Z0-9_]+/minSdk = 23/g' "$f" || true
              sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*[0-9]+/minSdk = 23/g' "$f" || true
              sed -n '1,120p' "$f"
            fi
          done
          echo "Done patching. Current minSdk lines:"
          grep -E "minSdkVersion|minSdk" -R android/app || true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking — surfaces issues without failing the build)
        run: flutter analyze || true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: care-plus-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: care-plus-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
