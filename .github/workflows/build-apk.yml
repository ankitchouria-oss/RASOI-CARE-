name: Build APK

# Runs on every push, and can also be triggered manually from the Actions tab
# (Actions → Build APK → Run workflow) without needing a new commit.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # This repo's android/gradle/wrapper/gradle-wrapper.properties already
      # points at Gradle 8.9 — we just need the wrapper's jar, which is a
      # binary that can't be committed as plain text. Installing Gradle here
      # and running `gradle wrapper` regenerates it in one step.
      - name: Install Gradle and regenerate the wrapper jar
        uses: gradle/actions/setup-gradle@v4
      - name: Generate gradle-wrapper.jar
        working-directory: android
        run: gradle wrapper --gradle-version 8.9

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking — surfaces issues without failing the build)
        run: flutter analyze || true

      # Debug APK: no signing config needed, installs directly on any device
      # with "unknown sources" allowed. This is the one most people want first.
      - name: Build debug APK
        run: flutter build apk --debug

      # Release APK: uses android/key.properties if you've added one (see the
      # main README §1b), otherwise falls back to the debug signing key so
      # this step never fails — just isn't Play-Store-ready until you sign it.
      - name: Build release APK
        run: flutter build apk --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: care-plus-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: care-plus-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
